
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aethermine.lua'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aethermine.lua'

        minSdk 23
        targetSdk 35

        versionCode 1
        versionName '1.0'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'

                arguments '-DANDROID_STL=c++_static'
            }
        }

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }

        release {
            minifyEnabled false
        }
    }
}
