<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d1b">
<title>AETHER MINE • Lua Game Studio V2.0</title>
<style>
:root{color-scheme:dark;--bg:#080d1b;--panel:#101a2d;--line:#243654;--text:#edf4ff;--muted:#91a4c3;--cyan:#55e6ff;--green:#53e0a0;--red:#ff687e}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}body{height:100vh;height:100dvh}button,input,textarea{font:inherit}button{border:1px solid #304565;border-radius:10px;background:#1a2943;color:var(--text);padding:9px 12px;font-weight:700;min-height:38px}button:active{filter:brightness(1.25)}button.primary{background:linear-gradient(120deg,#36d9ed,#638cff);color:#071321;border:0}button.stop{background:#3a1d2b;color:#ff9aaa}button.danger{color:#ff9aaa;border-color:#713447}.top{flex:none;min-height:48px;padding:7px 12px;background:#091225;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-weight:900;letter-spacing:1px}.sub{font-size:10px;color:var(--muted)}#status{font-size:10px;color:var(--green);text-align:right}#app{height:100%;height:100dvh;display:flex;flex-direction:column;min-height:0}nav{display:flex;gap:6px;padding:7px;flex:none;background:#0b1425;border-bottom:1px solid var(--line)}nav button{flex:1;min-width:0;padding:8px 4px;font-size:12px}.page{display:none;flex:1;min-height:0;min-width:0;flex-direction:column}.page.active{display:flex}.toolbar{display:flex;gap:7px;flex-wrap:wrap;padding:9px 10px 7px;flex:none}.project-name{margin:0 10px 7px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#0c1526;color:var(--text);width:calc(100% - 20px);outline:none}#code{margin:0 10px 10px;flex:1;min-height:0;width:calc(100% - 20px);resize:none;border:1px solid var(--line);border-radius:12px;background:#090f1d;color:#dceaff;padding:12px;font:13px/1.55 monospace;white-space:pre;tab-size:4;outline:none;overflow:auto}#saveList{padding:10px;overflow:auto;min-height:0}.saved-item{display:flex;align-items:center;gap:8px;padding:10px;margin-bottom:8px;border:1px solid var(--line);border-radius:11px;background:#101a2d}.saved-open{flex:1;text-align:left;min-width:0;overflow-wrap:anywhere}.saved-meta{font-size:10px;color:var(--muted);display:block;font-weight:400;margin-top:3px}.empty{padding:24px 12px;text-align:center;color:var(--muted);font-size:13px}.page-head{padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex:none}.page-head strong{font-size:13px;letter-spacing:.5px}.page-head .actions{display:flex;gap:6px}.page-head button{padding:7px 10px}.preview-wrap{flex:1;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;padding:8px;background:#050a13;overflow:hidden}#gameCanvas{display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;background:#101a2d;border:1px solid var(--line);border-radius:8px}#console{flex:1;min-height:0;overflow:auto;background:#070d18;border:1px solid var(--line);border-radius:10px;margin:0 10px 10px;padding:10px;color:#bfe7d4;font:12px/1.6 monospace;white-space:pre-wrap;overflow-wrap:anywhere}.console-tools{display:flex;gap:7px;padding:8px 10px;flex:none}#toast{position:fixed;z-index:20;bottom:14px;left:50%;transform:translateX(-50%);max-width:90vw;background:#203652;padding:9px 13px;border-radius:10px;font-size:12px;display:none;box-shadow:0 5px 20px #0008}.muted{color:var(--muted)}
@media(orientation:landscape){.top{min-height:38px;padding:4px 10px}.sub{font-size:9px}nav{padding:4px 7px}nav button{min-height:32px;padding:5px 3px}.toolbar{padding:6px 9px}.toolbar button{min-height:32px;padding:6px 9px}#code{font-size:12px}.page-head{padding:4px 8px}.preview-wrap{padding:4px}}
</style>
</head>
<body>
<div id="app">
 <header class="top"><div><div class="brand">λ AETHER MINE</div><div class="sub">LUA GAME STUDIO • V2.0</div></div><div id="status">ENGINE CHECK…</div></header>
 <nav>
  <button id="editorTab">Editor</button><button id="savedTab">Save Done</button><button id="gameTab">Preview / Run</button><button id="consoleTab">Console</button>
 </nav>
 <section id="editorPage" class="page active">
  <div class="toolbar"><button class="primary" id="runBtn">▶ Run</button><button id="saveBtn">▣ Save</button><button id="sampleBtn">✦ Example</button><button id="clearBtn">Clear</button></div>
  <input id="projectName" class="project-name" maxlength="60" placeholder="Project / App name লিখুন" autocomplete="off">
  <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
 </section>
 <section id="savedPage" class="page"><div class="page-head"><strong>SAVED PROJECTS</strong><button id="savedRefresh">↻ Refresh</button></div><div id="saveList"></div></section>
 <section id="gamePage" class="page">
  <div class="page-head"><strong>PREVIEW / RUN</strong><div class="actions"><button id="stopBtn" class="stop">■ Stop</button><button id="previewConsoleBtn">Console</button></div></div>
  <div class="preview-wrap"><canvas id="gameCanvas" width="800" height="450"></canvas></div>
 </section>
 <section id="consolePage" class="page"><div class="page-head"><strong>CONSOLE / ERROR LOG</strong><button id="clearLogBtn">Clear Log</button></div><div id="console">AETHER MINE Lua Game Studio V2.0 ready.</div><div class="console-tools"><button id="consoleEditorBtn">← Editor</button><button id="consolePreviewBtn">Preview</button></div></section>
</div><div id="toast"></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const starter=`-- AETHER MINE LUA GAME STUDIO V2.0
-- 2D Platformer example
-- API: game.create, background, rect, circle, line, text, key

game.create(800, 450)
local player = {x=90,y=330,w=42,h=54,vx=0,vy=0,onGround=false}
local platforms = {{x=0,y=410,w=800,h=40},{x=210,y=330,w=150,h=18},{x=440,y=270,w=145,h=18},{x=630,y=340,w=120,h=18}}
local gravity,speed,jumpPower=0.55,4.2,-11
function update()
 player.vx=0
 if game.key("left") then player.vx=-speed end
 if game.key("right") then player.vx=speed end
 if game.key("jump") and player.onGround then player.vy=jumpPower;player.onGround=false end
 player.x=player.x+player.vx;player.vy=player.vy+gravity;player.y=player.y+player.vy;player.onGround=false
 for _,p in ipairs(platforms) do
  if player.x+player.w>p.x and player.x<p.x+p.w and player.y+player.h>=p.y and player.y+player.h<=p.y+p.h+12 and player.vy>=0 then
   player.y=p.y-player.h;player.vy=0;player.onGround=true
  end
 end
 if player.x<0 then player.x=0 end
 if player.x+player.w>800 then player.x=800-player.w end
 if player.y>500 then player.x,player.y,player.vy=90,330,0 end
end
function draw()
 game.background("#79c9f2")
 game.circle(690,75,38,"#ffe27a")
 game.rect(0,370,800,80,"#5dbb68")
 for _,p in ipairs(platforms) do game.rect(p.x,p.y,p.w,p.h,"#79543b");game.rect(p.x,p.y,p.w,5,"#a4df73") end
 game.rect(player.x,player.y,player.w,player.h,"#e83d54")
 game.rect(player.x+8,player.y+10,8,8,"#ffffff");game.rect(player.x+27,player.y+10,8,8,"#ffffff")
 game.text("AETHER MINE 2D",20,35,23,"#ffffff")
end
print("2D example loaded")`;
const code=$('code'),canvas=$('gameCanvas'),ctx=canvas.getContext('2d');
let active=false,raf=0,keys=new Set(),projects={};
const STORE='aetherMineLuaStudioProjectsV2';
function toast(s){const t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',1800)}
function page(name){['editor','saved','game','console'].forEach(n=>$(`${n}Page`).classList.toggle('active',n===name));if(name==='saved')renderSaved();if(name==='game')fitCanvas()}
function log(s){const c=$('console');if(c.textContent.startsWith('AETHER MINE'))c.textContent='';c.textContent+=(c.textContent?'\n':'')+String(s);c.scrollTop=c.scrollHeight}
function decode(s){return s.replace(/\\t/g,'\t').replace(/\\n/g,'\n').replace(/\\r/g,'\r').replace(/\\\\/g,'\\')}
function parseResult(raw){if(!raw)return;raw.split(/\r?\n/).forEach(row=>{if(row.startsWith('@PRINT\t')){log(decode(row.slice(7)));return}if(!row.startsWith('@GAME\t'))return;const a=row.slice(6).split('\t'),cmd=a[0],v=a.slice(1).map(decode),n=i=>Number(v[i]||0);
 if(cmd==='create'){canvas.width=Math.max(1,Math.min(4096,n(0)));canvas.height=Math.max(1,Math.min(4096,n(1)));fitCanvas()}
 else if(cmd==='background'){ctx.fillStyle=v[0];ctx.fillRect(0,0,canvas.width,canvas.height)}
 else if(cmd==='rect'){ctx.fillStyle=v[4];ctx.fillRect(n(0),n(1),n(2),n(3))}
 else if(cmd==='circle'){ctx.fillStyle=v[3];ctx.beginPath();ctx.arc(n(0),n(1),Math.max(0,n(2)),0,Math.PI*2);ctx.fill()}
 else if(cmd==='line'){ctx.strokeStyle=v[4];ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(n(0),n(1));ctx.lineTo(n(2),n(3));ctx.stroke()}
 else if(cmd==='text'){ctx.fillStyle=v[4];ctx.font=`${Math.max(8,Math.min(100,n(3)))}px system-ui`;ctx.fillText(v[0],n(1),n(2))}
 })}
function fitCanvas(){/* Canvas CSS scales to the full available preview area; its drawing resolution stays game-defined. */}
function keyString(){return [...keys].join(',')}
function frame(){if(!active)return;try{parseResult(window.AetherLua.frame(keyString()))}catch(e){log('FRAME ERROR: '+e.message);stop();page('console');return}raf=requestAnimationFrame(frame)}
function run(){if(!window.AetherLua||typeof AetherLua.runGame!=='function'){log('ERROR: Updated Android bridge required.');page('console');return}stop(false);$('console').textContent='';log('Starting Lua project…');page('game');try{const result=AetherLua.runGame(code.value);parseResult(result);if((result||'').includes('@PRINT\tERROR:')){log('Game start reported an error.');page('console');return}active=true;raf=requestAnimationFrame(frame);log('Run started.')}catch(e){log('RUN ERROR: '+e.message);page('console')}}
function stop(callNative=true){active=false;if(raf)cancelAnimationFrame(raf);raf=0;keys.clear();if(callNative&&window.AetherLua&&typeof AetherLua.stopGame==='function')try{AetherLua.stopGame()}catch(_){} }
function loadProjects(){try{projects=JSON.parse(localStorage.getItem(STORE)||'{}');if(!projects||typeof projects!=='object')projects={}}catch(_){projects={}}}
function saveProject(){let name=$('projectName').value.trim();if(!name)name=prompt('প্রজেক্টের নাম লিখুন:','My Lua Project')||'';name=name.trim();if(!name){toast('নাম দেওয়া হয়নি');return}const key=name.toLowerCase();projects[key]={name,code:code.value,updated:new Date().toLocaleString()};try{localStorage.setItem(STORE,JSON.stringify(projects));$('projectName').value=name;renderSaved();toast('Save Done: '+name)}catch(e){toast('Save failed: storage full')}}
function renderSaved(){loadProjects();const list=$('saveList');list.innerHTML='';const entries=Object.entries(projects);if(!entries.length){list.innerHTML='<div class="empty">এখনো কোনো প্রজেক্ট Save করা হয়নি।<br>Editor-এ গিয়ে নাম লিখে Save চাপুন।</div>';return}entries.sort((a,b)=>(b[1].updated||'').localeCompare(a[1].updated||''));entries.forEach(([key,p])=>{const row=document.createElement('div');row.className='saved-item';const open=document.createElement('button');open.className='saved-open';open.textContent=p.name;const meta=document.createElement('span');meta.className='saved-meta';meta.textContent='Saved • '+(p.updated||'');open.appendChild(meta);open.onclick=()=>{code.value=p.code||'';$('projectName').value=p.name;page('editor');toast('প্রজেক্ট খুলেছে: '+p.name)};const del=document.createElement('button');del.className='danger';del.textContent='Delete';del.onclick=()=>{if(confirm('এই প্রজেক্টটি মুছে ফেলবে?')){delete projects[key];localStorage.setItem(STORE,JSON.stringify(projects));renderSaved()}};row.append(open,del);list.appendChild(row)})}
$('runBtn').onclick=run;$('saveBtn').onclick=saveProject;$('stopBtn').onclick=()=>{stop();log('Project stopped.');page('console')};$('sampleBtn').onclick=()=>{code.value=starter;$('projectName').value='2D Platformer Example';toast('Example loaded')};$('clearBtn').onclick=()=>{code.value='';toast('Editor cleared')};
$('editorTab').onclick=()=>page('editor');$('savedTab').onclick=()=>page('saved');$('gameTab').onclick=()=>page('game');$('consoleTab').onclick=()=>page('console');$('savedRefresh').onclick=renderSaved;$('previewConsoleBtn').onclick=()=>page('console');$('consoleEditorBtn').onclick=()=>page('editor');$('consolePreviewBtn').onclick=()=>page('game');$('clearLogBtn').onclick=()=>$('console').textContent='Console cleared.';
// Only physical keyboard events are forwarded. No extra on-screen game controls are injected.
function mapKey(e){const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')return'left';if(k==='arrowright'||k==='d')return'right';if(k===' '||k==='arrowup'||k==='w')return'jump';return null}
window.addEventListener('keydown',e=>{const k=mapKey(e);if(k){e.preventDefault();keys.add(k)}});window.addEventListener('keyup',e=>{const k=mapKey(e);if(k)keys.delete(k)});window.addEventListener('blur',()=>keys.clear());window.addEventListener('resize',fitCanvas);window.addEventListener('orientationchange',()=>setTimeout(fitCanvas,150));
loadProjects();try{code.value=localStorage.getItem('aetherLuaGameCode')||starter}catch(_){code.value=starter}try{if(window.AetherLua&&AetherLua.nativeEngineStatus)$('status').textContent=AetherLua.nativeEngineStatus();else $('status').textContent='BRIDGE CHECK'}catch(e){$('status').textContent='ENGINE CHECK ERROR'}
})();
</script>
</body></html>
